<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PowerPoint AI Add-in 架构图</title>
  <desc id="desc">展示任务窗格、Agent、工具层与 PowerPoint 文档的交互关系。</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #d7deea; stroke-width: 2; rx: 18; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2a44; }
      .label { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #21314f; }
      .text { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4a5875; }
      .chipBlue { fill: #e9f2ff; stroke: #6b9cff; stroke-width: 2; rx: 14; }
      .chipGreen { fill: #ebfbf4; stroke: #51b88a; stroke-width: 2; rx: 14; }
      .chipOrange { fill: #fff4e9; stroke: #f0a552; stroke-width: 2; rx: 14; }
      .arrow { stroke: #5e77a8; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .mutedArrow { stroke: #96a5c4; stroke-width: 3; fill: none; marker-end: url(#arrowMuted); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5e77a8"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#96a5c4"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <text x="64" y="72" class="title">PowerPoint AI Add-in · 架构总览</text>

  <rect class="panel" x="60" y="120" width="300" height="230"/>
  <text x="88" y="162" class="label">任务窗格 UI</text>
  <text x="88" y="198" class="text">- 对话输入 / 历史记录</text>
  <text x="88" y="228" class="text">- Provider 与模型切换</text>
  <text x="88" y="258" class="text">- 发送、暂停、刷新上下文</text>
  <rect class="chipBlue" x="86" y="286" width="240" height="42"/>
  <text x="106" y="313" class="text">用户请求 + 配置状态</text>

  <rect class="panel" x="450" y="120" width="300" height="230"/>
  <text x="478" y="162" class="label">Agent / Messages API</text>
  <text x="478" y="198" class="text">- 兼容 Anthropic `/v1/messages`</text>
  <text x="478" y="228" class="text">- 解析 `tool_use` 与取消信号</text>
  <text x="478" y="258" class="text">- 多轮 tool loop</text>
  <rect class="chipBlue" x="476" y="286" width="244" height="42"/>
  <text x="496" y="313" class="text">模型输出 + 工具调度</text>

  <rect class="panel" x="840" y="120" width="300" height="230"/>
  <text x="868" y="162" class="label">Provider</text>
  <text x="868" y="198" class="text">- z.ai / MiniMax / Anthropic</text>
  <text x="868" y="228" class="text">- 真实模型名解析</text>
  <text x="868" y="258" class="text">- 本地配置与覆盖逻辑</text>
  <rect class="chipOrange" x="866" y="286" width="228" height="42"/>
  <text x="886" y="313" class="text">API 请求与响应</text>

  <rect class="panel" x="120" y="430" width="360" height="210"/>
  <text x="148" y="472" class="label">工具层</text>
  <text x="148" y="508" class="text">- get_current_context / review_slide</text>
  <text x="148" y="538" class="text">- create_diagram / connect_shapes</text>
  <text x="148" y="568" class="text">- delete_shape / modify_shape 等</text>
  <rect class="chipGreen" x="146" y="592" width="286" height="42"/>
  <text x="166" y="619" class="text">Office.js + 业务逻辑封装</text>

  <rect class="panel" x="580" y="430" width="250" height="210"/>
  <text x="608" y="472" class="label">XML 修正层</text>
  <text x="608" y="508" class="text">- exportAsBase64()</text>
  <text x="608" y="538" class="text">- JSZip + slide1.xml</text>
  <text x="608" y="568" class="text">- insertSlidesFromBase64()</text>
  <rect class="chipOrange" x="606" y="592" width="176" height="42"/>
  <text x="626" y="619" class="text">连接器专项修正</text>

  <rect class="panel" x="910" y="430" width="230" height="210"/>
  <text x="938" y="472" class="label">PowerPoint 文档</text>
  <text x="938" y="508" class="text">- 幻灯片</text>
  <text x="938" y="538" class="text">- 形状与文本</text>
  <text x="938" y="568" class="text">- 连线与布局结果</text>
  <rect class="chipGreen" x="936" y="592" width="154" height="42"/>
  <text x="956" y="619" class="text">最终视觉产物</text>

  <path class="arrow" d="M360 235 H450"/>
  <path class="arrow" d="M750 235 H840"/>
  <path class="arrow" d="M600 350 V390 H300 V430"/>
  <path class="arrow" d="M300 640 H580"/>
  <path class="arrow" d="M830 535 H910"/>
  <path class="mutedArrow" d="M480 535 H540"/>
  <path class="mutedArrow" d="M1040 430 V350 H1040 350"/>
</svg>
